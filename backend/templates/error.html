<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ - ماسح أمان رمز QR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1><i class="fas fa-qrcode"></i> ماسح أمان رمز QR</h1>
            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="/scan"><i class="fas fa-camera"></i> مسح QR</a>
                <a href="/manual"><i class="fas fa-link"></i> فحص رابط</a>
            </div>
        </div>
    </nav>

    <div class="container error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h2>عذراً! حدث خطأ</h2>
            <p class="error-message">{{ error }}</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home"></i> العودة للرئيسية
                </a>
                <a href="javascript:history.back()" class="btn btn-secondary">
                    <i class="fas fa-arrow-right"></i> الرجوع للصفحة السابقة
                </a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 ماسح أمان رمز QR. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <style>
        .error-container {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .error-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .error-icon {
            font-size: 5rem;
            color: #e53e3e;
            margin-bottom: 20px;
        }
        .error-card h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .error-message {
            color: #718096;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</body>
</html>
